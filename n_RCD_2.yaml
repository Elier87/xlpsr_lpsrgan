dataset:
  input_root: "./ufpr-sr/UFPR-SR-plates"
  output_root: "./ufpr-sr/UFPR-SR-plates_2"
  copy_non_lr_files: true
  overwrite: false
  seed: 123

matching:
  match_existing_lr_size: true
  fallback_scale_factor: 2

nrcd:
  n_stage: 2
  stage_apply_prob: [1.0, 0.8]

  blur:
    apply_prob: 0.5
    kernel_type_prob:
      gaussian: 0.7
      generalized_gaussian: 0.15
      plateau: 0.15
    kernel_sizes: [7, 9, 11, 13, 15, 17, 19, 21]
    sigma_range: [0.2, 1.5]
    generalized_beta_range: [0.5, 4.0]
    plateau_beta_range: [1.0, 2.0]

  ringing:
    apply_prob: 0.5
    kernel_size_range: [7, 21]
    cutoff_range: [0.35, 0.9]

  resize:
    apply_prob: 0.5
    mode_prob:
      upsample: 0.1
      downsample: 0.8
      keep: 0.1
    scale_range: [0.8, 1.15]
    interpolation_pool: ["area", "bilinear", "bicubic"]
    use_nearest: false

  noise:
    gaussian_apply_prob: 0.5
    poisson_apply_prob: 0.5
    gaussian_prob: 0.5
    poisson_prob: 0.5
    gaussian_std_range: [0.8, 3.0]
    poisson_scale_range: [1.2, 2.0]
    grayscale_noise_prob: 0.8

  jpeg:
    apply_prob: 0.5
    quality_range: [20, 40]

output:
  save_dtype: "uint8"
  save_format: "png"

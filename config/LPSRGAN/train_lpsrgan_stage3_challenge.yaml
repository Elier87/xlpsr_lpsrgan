model:
  name: lpsrgan
  load: ./save/train_lpsrgan_stage2_parseq/epoch-last.pth
  args:
    num_blocks: 3
    dropout_prob: 0.5

model_ocr:
  name: gplpr_trainable_ocr
  freeze: True
  args:
    load: ./save/train_ocr_stage3_challenge/epoch-last.pth
    alphabet: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
    nc: 3
    imgW: 96
    imgH: 32
    K: 8
    isSeqModel: True
    head: 2
    inner: 256
    isl2Norm: True

optimizer_g:
  name: adam
  args:
    lr: 5.e-5
    betas: [0.5, 0.999]

optimizer_d:
  name: adam
  args:
    lr: 1.e-4
    betas: [0.5, 0.999]

func_train: lpsrgan_challenge_finetune
func_val: lpsrgan_challenge_val
training_stage: challenge_finetune
tag_view: stage3_challenge
visualize_interval: 0
sr_size: [32, 96]
challenge_anchor_weight: 0.1
challenge_ocr_weight: 1.0
challenge_require_gt_ocr_loss: True
ocr_score_conf_threshold: 0.5
val_visualize_max_samples: 0

train_dataset:
  dataset:
    name: challenge_sequence
    args:
      root: ./xlpsr/train_data/challenge_development_set_final
      ground_truth_csv: ./xlpsr/train_data/challenge_development_set_final/ground_truth.csv
      phase: training
      train_ratio: 0.8
      val_ratio: 0.2
  wrapper:
    name: challenge_finetune_wrapper
    args:
      imgW: 48
      imgH: 16
      aug: False
      image_aspect_ratio: 3
      background: (127, 127, 127)
      bbox_margin: 0.08
      selection: quality
      topk_pool: 5
      sample_strategy: random_topk
  batch: 8

val_dataset:
  dataset:
    name: challenge_sequence
    args:
      root: ./xlpsr/train_data/challenge_development_set_final
      ground_truth_csv: ./xlpsr/train_data/challenge_development_set_final/ground_truth.csv
      phase: validation
      train_ratio: 0.8
      val_ratio: 0.2
  wrapper:
    name: challenge_finetune_wrapper
    args:
      imgW: 48
      imgH: 16
      aug: False
      image_aspect_ratio: 3
      background: (127, 127, 127)
      bbox_margin: 0.08
      selection: quality
      topk_pool: 1
      sample_strategy: best
  batch: 8

loss:
  name: noopLoss
  args: {}

early_stopper:
  patience: 30
  min_delta: 0
  counter: 0

reduce_on_plateau:
  mode: min
  factor: 0.5
  patience: 8
  min_lr: 1.e-7
  verbose: True

epoch_max: 80
epoch_save: 20
resume: null

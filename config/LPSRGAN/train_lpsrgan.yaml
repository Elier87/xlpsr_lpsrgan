model:
  name: lpsrgan
  args:
    num_blocks: 3
    dropout_prob: 0.5

optimizer_g:
  name: adam
  args:
    lr: 1.e-4
    betas: [0.5, 0.999]

optimizer_d:
  name: adam
  args:
    lr: 1.e-4
    betas: [0.5, 0.999]

func_train: lpsrgan_train
func_val: lpsrgan_val
training_stage: gan
tag_view: paired_gan
visualize_interval: 5

train_dataset:
  dataset:
    name: ufpr_paired
    args:
      roots:
        - ./ufpr-sr/UFPR-SR-plates_3/1920_1080
        - ./ufpr-sr/UFPR-SR-plates_3/1280_0960
      phase: training
  wrapper:
    name: lpsrgan
    args:
      imgW: 48
      imgH: 16
      aug: True
      image_aspect_ratio: 3
      background: (127, 127, 127)
      projection_prob: 0.3
      projection_horizontal_angle: 30
      projection_vertical_angle: 10
      rectify: False
  batch: 32

val_dataset:
  dataset:
    name: ufpr_paired
    args:
      roots:
        - ./ufpr-sr/UFPR-SR-plates_3/1920_1080
        - ./ufpr-sr/UFPR-SR-plates_3/1280_0960
      phase: validation
  wrapper:
    name: lpsrgan
    args:
      imgW: 48
      imgH: 16
      aug: False
      image_aspect_ratio: 3
      background: (127, 127, 127)
      projection_prob: 0.0
      projection_horizontal_angle: 0
      projection_vertical_angle: 0
      rectify: False
  batch: 256

loss:
  name: lpsrganLoss
  args:
    pixel_weight: 1.0
    perceptual_weight: 0.1
    adversarial_weight: 0.005
    use_perceptual: True
    use_ocr: False
    ocr_weight: 0.0
    load: null

early_stopper:
  patience: 30
  min_delta: 0
  counter: 0

reduce_on_plateau:
  mode: min
  factor: 0.5
  patience: 10
  min_lr: 1.e-7
  verbose: True

epoch_max: 150
epoch_save: 25
resume: ./save/train_lpsrgan_n3/epoch-last.pth

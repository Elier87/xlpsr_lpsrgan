model:
  name: lpsrgan
  args:
    num_blocks: 3
    dropout_prob: 0.5

model_ocr:
  name: parseq_frlp_head
  freeze: False
  args:
    hub_repo: baudm/parseq
    model_name: parseq
    pretrained: True
    load: null
    img_size: [32, 128]
    source: github
    hidden_dim: 64
    dropout: 0.1
    max_plate_len: 8
    confidence_threshold: 0.65
    freeze_backbone: True

optimizer_g:
  name: adam
  args:
    lr: 2.e-5
    betas: [0.5, 0.999]

optimizer_d:
  name: adam
  args:
    lr: 1.e-4
    betas: [0.5, 0.999]

optimizer_ocr:
  name: adam
  args:
    lr: 5.e-4
    betas: [0.9, 0.999]

func_train: challenge_frlp_head_train
func_val: challenge_frlp_head_val
training_stage: stage3_frlp_head
tag_view: stage3_frlp_head
visualize_interval: 10
sr_size: [32, 96]
decision_strategy: character_vote

frlp_conf_threshold: 0.4
frlp_token_ce_weight: 1.0
frlp_position_ce_weight: 0.25
frlp_length_weight: 0.25
frlp_score_weight: 0.0
optional_image_regularization_weight: 0.0
val_visualize_max_samples: 8

train_dataset:
  dataset:
    name: challenge_sequence
    args:
      root: ./xlpsr/train_data/challenge_development_set_final
      ground_truth_csv: ./xlpsr/train_data/challenge_development_set_final/ground_truth.csv
      phase: training
      train_ratio: 0.8
      val_ratio: 0.2
  wrapper:
    name: challenge_sequence_wrapper
    args:
      imgW: 48
      imgH: 16
      aug: False
      image_aspect_ratio: 3
      background: (127, 127, 127)
      mode: sequence
      num_frames: 5
      bbox_margin: 0.08
      selection: quality
  batch: 2

val_dataset:
  dataset:
    name: challenge_sequence
    args:
      root: ./xlpsr/train_data/challenge_development_set_final
      ground_truth_csv: ./xlpsr/train_data/challenge_development_set_final/ground_truth.csv
      phase: validation
      train_ratio: 0.8
      val_ratio: 0.2
  wrapper:
    name: challenge_sequence_wrapper
    args:
      imgW: 48
      imgH: 16
      aug: False
      image_aspect_ratio: 3
      background: (127, 127, 127)
      mode: sequence
      num_frames: 5
      bbox_margin: 0.08
      selection: quality
  batch: 4

loss:
  name: noopLoss
  args: {}

early_stopper:
  patience: 10
  min_delta: 0
  counter: 0

reduce_on_plateau:
  mode: min
  factor: 0.5
  patience: 6
  min_lr: 1.e-7
  verbose: True

epoch_max: 120
epoch_save: 20
resume_mode: finetune
resume: ./save/train_lpsrgan_stage2_parseq/epoch-last.pth

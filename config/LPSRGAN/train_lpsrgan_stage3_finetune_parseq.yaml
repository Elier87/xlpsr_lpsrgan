model:
  name: lpsrgan
  args:
    num_blocks: 3
    dropout_prob: 0.5

model_ocr:
  name: parseq_ocr
  freeze: True
  args:
    hub_repo: baudm/parseq
    model_name: parseq
    pretrained: True
    load: null
    img_size: [32, 128]
    source: github

optimizer_g:
  name: adam
  args:
    lr: 5.e-5
    betas: [0.5, 0.999]

optimizer_d:
  name: adam
  args:
    lr: 1.e-4
    betas: [0.5, 0.999]

func_train: challenge_finetune_train
func_val: challenge_finetune_val
training_stage: stage3_finetune
tag_view: stage3_finetune_parseq
visualize_interval: 0
sr_size: [32, 96]
decision_strategy: character_vote

challenge_teacher_weight: 1.0
challenge_teacher_mode: distill
challenge_teacher_temperature: 1.5
challenge_teacher_confidence_weighted: True
challenge_sharpness_weight: 0.02
challenge_sequence_consistency_weight: 0.05
challenge_image_anchor_weight: 0.0

ocr_score_conf_threshold: 0.65
val_visualize_max_samples: 5

train_dataset:
  dataset:
    name: challenge_sequence
    args:
      root: ./xlpsr/train_data/challenge_development_set_final
      ground_truth_csv: ./xlpsr/train_data/challenge_development_set_final/ground_truth.csv
      phase: training
      train_ratio: 0.8
      val_ratio: 0.2
  wrapper:
    name: challenge_sequence_wrapper
    args:
      imgW: 48
      imgH: 16
      aug: False
      image_aspect_ratio: 3
      background: (127, 127, 127)
      mode: sequence
      num_frames: 10
      bbox_margin: 0.08
      selection: quality
  batch: 4

val_dataset:
  dataset:
    name: challenge_sequence
    args:
      root: ./xlpsr/train_data/challenge_development_set_final
      ground_truth_csv: ./xlpsr/train_data/challenge_development_set_final/ground_truth.csv
      phase: validation
      train_ratio: 0.8
      val_ratio: 0.2
  wrapper:
    name: challenge_sequence_wrapper
    args:
      imgW: 48
      imgH: 16
      aug: False
      image_aspect_ratio: 3
      background: (127, 127, 127)
      mode: sequence
      num_frames: 10
      bbox_margin: 0.08
      selection: quality
  batch: 4

loss:
  name: noopLoss
  args: {}

early_stopper:
  patience: 10
  min_delta: 0
  counter: 0

reduce_on_plateau:
  mode: min
  factor: 0.5
  patience: 8
  min_lr: 1.e-7
  verbose: True

epoch_max: 120
epoch_save: 20
resume: ./save/train_lpsrgan_stage2_parseq/epoch-last.pth

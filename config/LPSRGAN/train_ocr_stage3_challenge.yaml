model:
  name: gplpr_trainable_ocr
  args:
    load: null
    alphabet: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
    nc: 3
    imgW: 96
    imgH: 32
    K: 8
    isSeqModel: True
    head: 2
    inner: 256
    isl2Norm: True

optimizer:
  name: adam
  args:
    lr: 5.e-5
    betas: [0.9, 0.999]

func_train: ocr_train
func_val: ocr_val
training_stage: stage3_ocr
tag_view: stage3_ocr
ocr_input_key: lr
ocr_score_conf_threshold: 0.5
val_visualize_max_samples: 0

train_dataset:
  dataset:
    name: challenge_sequence
    args:
      root: ./xlpsr/train_data/challenge_development_set_final
      ground_truth_csv: ./xlpsr/train_data/challenge_development_set_final/ground_truth.csv
      phase: training
      train_ratio: 0.8
      val_ratio: 0.2
  wrapper:
    name: challenge_finetune_wrapper
    args:
      imgW: 48
      imgH: 16
      aug: False
      image_aspect_ratio: 3
      background: (127, 127, 127)
      bbox_margin: 0.08
      selection: quality
      topk_pool: 5
      sample_strategy: random_topk
  batch: 8

val_dataset:
  dataset:
    name: challenge_sequence
    args:
      root: ./xlpsr/train_data/challenge_development_set_final
      ground_truth_csv: ./xlpsr/train_data/challenge_development_set_final/ground_truth.csv
      phase: validation
      train_ratio: 0.8
      val_ratio: 0.2
  wrapper:
    name: challenge_finetune_wrapper
    args:
      imgW: 48
      imgH: 16
      aug: False
      image_aspect_ratio: 3
      background: (127, 127, 127)
      bbox_margin: 0.08
      selection: quality
      topk_pool: 1
      sample_strategy: best
  batch: 8

loss:
  name: noopLoss
  args: {}

early_stopper:
  patience: 30
  min_delta: 0
  counter: 0

reduce_on_plateau:
  mode: min
  factor: 0.5
  patience: 8
  min_lr: 1.e-7
  verbose: True

epoch_max: 80
epoch_save: 20
resume: null
